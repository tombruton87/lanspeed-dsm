# LAN Speed on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=lanspeed
PKG_TITLE="LAN Speed"
PKG_DESC="A web-based iperf for your home network, in Container Manager: an iperf3 server on the Synology for PCs, a LibreSpeed browser test for phones and laptops, and a DSM window that runs iperf3 tests from the Synology to any device, keeps every result with a chart per device, tests on a schedule and tells DSM when the network is slower than it should be."
APP_ID="LanSpeed.AppInstance"
REPO=tombruton87/lanspeed-dsm
SERVICES="server web"
VOLUMES="data librespeed"
IMAGE_VARS="LS_IMAGE"
PORT=8790
PORTS="8790 8791 8792"
HEALTH_PATH=/backend/empty.php
APP_ACTIONS="runtest|device|undevice|schedule|clearhist"
APP_ANSWER_KEYS="IPERF_PORT"
APP_REQUEST_KEYS="TEST_HOST TEST_PORT TEST_PROTO TEST_DIR TEST_SECS TEST_STREAMS TEST_RATE DEV_HOST DEV_PORT DEV_NAME_B64 SCHED_EVERY THRESHOLD KEEP_DAYS IPERF_PORT"
TAGLINE="network speed"
WELCOME="LAN Speed measures how fast your home network really is, between this Synology and your other devices. PCs and other computers test with iperf3 against the Synology; phones and laptops without it open a speed test page in the browser. This package runs both in Container Manager, LAN only, and adds a window to DSM that runs iperf3 tests from the Synology to any device, keeps every result with a chart per device, tests on a schedule, and tells DSM when the network is slower than it should be."
BACKUP_WHAT="every test result (iperf3 and browser), your device names and the schedule (two small SQLite databases)."
SITE_NOTE="The address of the browser speed test. It's meant for your own network: a test through DSM's reverse proxy, a VPN or from outside measures those too, not just the network. The iperf3 server's port is below."
ICON_TOP="#22b8c7"
ICON_BOTTOM="#0e5f86"
ICON_LETTER="L"   # only if icon.png is missing
BETA=yes
